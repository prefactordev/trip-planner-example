services:
  - type: web
    name: trip-planner-example
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node build
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: TOGETHER_API_KEY
        sync: false
      - key: TOGETHER_MODEL
        value: moonshotai/Kimi-K3
