[project]
name = "trip-planner-example"
version = "0.1.0"
description = "A LangGraph road trip planner traced and judged in Prefactor"
requires-python = ">=3.11"
dependencies = [
    "prefactor-langchain>=0.3.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

# prefactor-langchain 0.3.0, which adds PrefactorCallbackHandler, is not on
# PyPI yet. Install it from the python-sdk branch until it is released.
[tool.uv.sources]
prefactor-langchain = { git = "https://github.com/prefactordev/python-sdk", branch = "pre-658-run-evals-on-trip-plans-during-each-run-and-in-an-eval", subdirectory = "packages/langchain" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
